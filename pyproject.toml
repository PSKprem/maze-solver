[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazesolver"
version = "1.0.0"
description = "Solve text mazes using BFS, DFS, and A* search."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "PSKprem" }]
keywords = ["maze", "pathfinding", "bfs", "dfs", "astar", "algorithms"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PSKprem/maze-solver"

[project.scripts]
mazesolver = "mazesolver.__main__:main"

[tool.setuptools]
packages = ["mazesolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
